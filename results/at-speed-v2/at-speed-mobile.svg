<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1170" role="img" aria-labelledby="title desc"><title id="title">At-speed braking: every condition</title><desc id="desc">Each policy passes 27 of 33 executions and has six contacts. Short-gap 15 m/s cases fail for both policies. Rows show pass counts and worst signed collision-hull clearance across three physics seeds.</desc><rect width="400" height="1170" fill="#fcfaf6"/><g font-family="Arial,sans-serif" fill="#332b3b"><text x="20" y="35" font-size="23" font-weight="700">At-speed braking</text><text x="20" y="64" font-size="15" >66 runs / 11 conditions / 3 physics seeds</text><text x="20" y="105" font-size="16" font-weight="700">Stationary · 10 m/s / 30 m</text><text x="20" y="129" font-size="15" fill="#396981">TTC: 3/3 pass · min gap 9.23 m</text><text x="20" y="151" font-size="15" fill="#b25d36">Envelope: 3/3 pass · min gap 10.87 m</text><line x1="20" y1="167" x2="378" y2="167" stroke="#d8d0da"/><text x="20" y="187" font-size="16" font-weight="700">Stationary · 15 m/s / 45 m</text><text x="20" y="211" font-size="15" fill="#396981">TTC: 3/3 pass · min gap 2.30 m</text><text x="20" y="233" font-size="15" fill="#b25d36">Envelope: 3/3 pass · min gap 15.39 m</text><line x1="20" y1="249" x2="378" y2="249" stroke="#d8d0da"/><text x="20" y="269" font-size="16" font-weight="700">Lower friction · 15 / 45</text><text x="20" y="293" font-size="15" fill="#396981">TTC: 3/3 pass · min gap 2.22 m</text><text x="20" y="315" font-size="15" fill="#b25d36">Envelope: 3/3 pass · min gap 2.84 m</text><line x1="20" y1="331" x2="378" y2="331" stroke="#d8d0da"/><text x="20" y="351" font-size="16" font-weight="700">Short gap · 15 / 18</text><text x="20" y="375" font-size="15" fill="#396981">TTC: 0/3 pass · min gap -0.15 m</text><text x="20" y="397" font-size="15" fill="#b25d36">Envelope: 0/3 pass · min gap -0.15 m</text><line x1="20" y1="413" x2="378" y2="413" stroke="#d8d0da"/><text x="20" y="433" font-size="16" font-weight="700">Severe stress · 15 / 9</text><text x="20" y="457" font-size="15" fill="#396981">TTC: 0/3 pass · min gap -0.44 m</text><text x="20" y="479" font-size="15" fill="#b25d36">Envelope: 0/3 pass · min gap -0.44 m</text><line x1="20" y1="495" x2="378" y2="495" stroke="#d8d0da"/><text x="20" y="515" font-size="16" font-weight="700">Moving lead target · 15 / 30</text><text x="20" y="539" font-size="15" fill="#396981">TTC: 3/3 pass · min gap 17.53 m</text><text x="20" y="561" font-size="15" fill="#b25d36">Envelope: 3/3 pass · min gap 21.31 m</text><line x1="20" y1="577" x2="378" y2="577" stroke="#d8d0da"/><text x="20" y="597" font-size="16" font-weight="700">Braking lead target · 15 / 30</text><text x="20" y="621" font-size="15" fill="#396981">TTC: 3/3 pass · min gap 18.30 m</text><text x="20" y="643" font-size="15" fill="#b25d36">Envelope: 3/3 pass · min gap 24.84 m</text><line x1="20" y1="659" x2="378" y2="659" stroke="#d8d0da"/><text x="20" y="679" font-size="16" font-weight="700">Sudden target · 10 / 22</text><text x="20" y="703" font-size="15" fill="#396981">TTC: 3/3 pass · min gap 2.33 m</text><text x="20" y="725" font-size="15" fill="#b25d36">Envelope: 3/3 pass · min gap 8.95 m</text><line x1="20" y1="741" x2="378" y2="741" stroke="#d8d0da"/><text x="20" y="761" font-size="16" font-weight="700">Range delayed by 256 ms</text><text x="20" y="785" font-size="15" fill="#396981">TTC: 3/3 pass · min gap 1.58 m</text><text x="20" y="807" font-size="15" fill="#b25d36">Envelope: 3/3 pass · min gap 20.67 m</text><line x1="20" y1="823" x2="378" y2="823" stroke="#d8d0da"/><text x="20" y="843" font-size="16" font-weight="700">Range dropout · 200 ms</text><text x="20" y="867" font-size="15" fill="#396981">TTC: 3/3 pass · min gap 18.35 m</text><text x="20" y="889" font-size="15" fill="#b25d36">Envelope: 3/3 pass · min gap 17.31 m</text><line x1="20" y1="905" x2="378" y2="905" stroke="#d8d0da"/><text x="20" y="925" font-size="16" font-weight="700">Noisy range · SD 0.5 m</text><text x="20" y="949" font-size="15" fill="#396981">TTC: 3/3 pass · min gap 2.71 m</text><text x="20" y="971" font-size="15" fill="#b25d36">Envelope: 3/3 pass · min gap 15.87 m</text><line x1="20" y1="987" x2="378" y2="987" stroke="#d8d0da"/><text x="20" y="1040" font-size="16" font-weight="700">Each policy: 27/33 pass; 6 contacts.</text><text x="20" y="1070" font-size="14" >Gap uses the collision hull, not vehicle reference.</text><text x="20" y="1093" font-size="14" >Measured cruise, scripted kinematic targets.</text><text x="20" y="1116" font-size="14" >Seeds repeat a small designed scenario family.</text><text x="20" y="1139" font-size="14" >No road-safety or weather validation claim.</text></g></svg>